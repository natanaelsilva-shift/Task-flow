<h2>Nova Tarefa</h2>

<form (ngSubmit)="salvar()">

  <label>Título:</label><br>
  <input type="text" name="titulo" [(ngModel)]="tarefa.titulo">
  <br><br>

  <label>Descrição:</label><br>
  <textarea name="descricao" [(ngModel)]="tarefa.descricao"></textarea>
  <br><br>

  <label>Categoria:</label><br>
  <select name="categoria" [(ngModel)]="tarefa.categoria">
    <option value="">Selecione</option>
    <option value="Trabalho">Trabalho</option>
    <option value="Pessoal">Pessoal</option>
    <option value="Estudos">Estudos</option>
    <option value="Outros">Outros</option>
  </select>
  <br><br>

  <label>Prioridade:</label><br>
  <select name="prioridade" [(ngModel)]="tarefa.prioridade">
    <option value="">Selecione</option>
    <option value="Alta">Alta</option>
    <option value="Média">Média</option>
    <option value="Baixa">Baixa</option>
  </select>
  <br><br>

  <button type="submit">Salvar</button>

</form>
